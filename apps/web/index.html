<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kontor</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header><h1>Kontor</h1></header>
    <main>
      <section>
        <h2>Offene Rechnungen</h2>
        <table>
          <thead>
            <tr><th>Nummer</th><th>Kunde</th><th>Fällig am</th><th></th></tr>
          </thead>
          <tbody id="invoices"></tbody>
        </table>
      </section>
      <section>
        <h2>Neuer Kunde</h2>
        <form id="customer">
          <label>Name <input name="name" required /></label>
          <label>E-Mail <input name="email" type="email" required /></label>
          <label>Straße <input name="street" required /></label>
          <label>PLZ <input name="postalCode" required pattern="\d{4,5}" /></label>
          <label>Ort <input name="city" required /></label>
          <label>
            Land
            <select name="country">
              <option value="DE">Deutschland</option>
              <option value="AT">Österreich</option>
            </select>
          </label>
          <label>
            Sprache
            <select name="locale">
              <option value="de">Deutsch</option>
              <option value="en">Englisch</option>
            </select>
          </label>
          <button>Anlegen</button>
          <output></output>
        </form>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
